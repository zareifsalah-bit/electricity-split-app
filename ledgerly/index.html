<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="1;url=https://ledgerly-salah.github.io/ledgerly-app/">
  <title>Ledgerly moved</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#081713;color:#eef7f3;font:16px system-ui,-apple-system,sans-serif}
    main{max-width:520px;padding:32px;text-align:center}
    a{color:#63d2ae}
  </style>
</head>
<body>
  <main>
    <h1>Ledgerly has moved</h1>
    <p>The active Ledgerly app now lives in its own repository and web-app origin.</p>
    <p><a href="https://ledgerly-salah.github.io/ledgerly-app/">Open Ledgerly</a></p>
  </main>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.filter(r=>r.scope.includes('/electricity-split-app/ledgerly/')).map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(k=>k.startsWith('ledgerly-shell-')).map(k=>caches.delete(k)));
        }
      }catch(e){}
      location.replace('https://ledgerly-salah.github.io/ledgerly-app/');
    })();
  </script>
</body>
</html>
